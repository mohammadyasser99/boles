<p-toast></p-toast>

<div class="space-y-5">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="font-display font-800 text-surface-800 text-2xl">Monthly Rental Payments</h1>
      <p class="text-surface-400 text-sm mt-1">Track and manage monthly rent payments</p>
    </div>
    <button pButton label="Add Payment" icon="pi pi-plus" (click)="openCreate()"
      class="!bg-brand-600 !border-brand-600 !font-display !font-700 !rounded-xl"></button>
  </div>

  <div class="bg-white rounded-2xl shadow-card border border-surface-200 overflow-hidden">
    <p-table [value]="payments()" [loading]="loading()" [paginator]="true" [rows]="10" styleClass="border-0">
      <ng-template pTemplate="header">
        <tr>
          <th>Car Plate</th>
          <th>client name</th>
          <th>Amount</th>
          <th>Paid At</th>
          <th class="text-right">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-payment>
        <tr>
          <td><span class="font-mono text-sm">{{ payment.carPlate }}</span></td>
          <td><span class="font-mono text-sm">{{ payment.name }}</span></td>
          <td><span class="font-mono text-sm">{{ payment.amount | number:'1.2-2' }}</span></td>
          <td><span class="text-sm">{{ payment.paidAt | date:'yyyy-MM-dd' }}</span></td>
          <td>
            <div class="flex justify-end gap-1">
              <button pButton icon="pi pi-pencil" pTooltip="Edit" tooltipPosition="top"
                (click)="openEdit(payment)"></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [header]="editMode() ? 'Edit Payment' : 'Add Payment'" [(visible)]="showDialog" [modal]="true" [style]="{width:'450px'}">
  <form [formGroup]="form" class="space-y-4 pt-2">

    @if (!editMode()) {
  
      <!-- User -->
      <div class="space-y-1.5">
        <label class="text-xs font-display font-600 text-surface-500 uppercase">
          User *
        </label>
  
        <p-dropdown
          [options]="userOptions()"
          formControlName="userId"
          optionLabel="label"
          optionValue="value"
          placeholder="Select user"
          appendTo="body"
          class="w-full">
        </p-dropdown>
      </div>
  
      <!-- Car -->
      <div class="space-y-1.5">
        <label class="text-xs font-display font-600 text-surface-500 uppercase">
          Car Plate *
        </label>
  
        <p-dropdown
          [options]="carOptions()"
          formControlName="carPlate"
          optionLabel="label"
          optionValue="value"
          placeholder="Select car"
          appendTo="body"
          class="w-full">
        </p-dropdown>
      </div>
  
    }
  
    <!-- Amount -->
    <div class="space-y-1.5">
      <label class="text-xs font-display font-600 text-surface-500 uppercase">
        Amount *
      </label>
  
      <p-inputNumber
        formControlName="amount"
        [min]="0"
        [minFractionDigits]="2"
        styleClass="w-full"
        inputStyleClass="w-full !rounded-xl">
      </p-inputNumber>
  
      <small class="text-red-500 text-xs"
        *ngIf="form.get('amount')?.touched && form.get('amount')?.invalid">
        Amount is required
      </small>
    </div>
  
    <!-- Paid At -->
    <div class="space-y-1.5">
      <label class="text-xs font-display font-600 text-surface-500 uppercase">
        Paid At *
      </label>
  
      <p-calendar
        formControlName="paidAt"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        appendTo="body">
      </p-calendar>
  
      <small class="text-red-500 text-xs"
        *ngIf="form.get('paidAt')?.touched && form.get('paidAt')?.invalid">
        Paid date is required
      </small>
    </div>
  
  </form>

  <ng-template pTemplate="footer">
    <button pButton label="Cancel" class="!p-button-text !rounded-xl" (click)="showDialog=false"></button>
    <button 
    pButton 
    [label]="editMode() ? 'Update' : 'Create'" 
    icon="pi pi-check"
    [loading]="saving()" 
    [disabled]="form.invalid"
    class="!bg-brand-600 !border-brand-600 !rounded-xl !font-display !font-700"
    (click)="save()">
  </button>
  </ng-template>
</p-dialog>
